# 用户态路由器示例配置
# 首跑时若本文件缺失，会告警并自动生成默认配置，绝不退出。
# 修改后：本地终端 reload 热加载；save 原子写回；putconf 远端下发。

[router]
hostname=router
threads=4            # 线程池 worker 数（启动时生效）
tcp_port=8899        # 远程管理 TCP（启动时生效）
udp_port=8900        # 远程状态 UDP（启动时生效）
arp_timeout=300      # ARP 老化秒数
arp_proxy=0          # 代理 ARP，1=开（默认关）
log_level=2          # 0=ERR 1=WARN 2=INFO 3=DEBUG
# password=          # 留空 = 远程 TCP 无鉴权；设值后远端需先 AUTH <password>

[filter]
# 旧格式兼容段：drop ip X → 自动转为防火墙 deny 规则
# drop ip 192.168.10.2

[firewall]
# 规则先到先中，未命中默认放行。语法同 addfw 命令：
#   drop|allow ip <sip[/len]> [dip[/len]] [proto tcp|udp|icmp|any] [sport N] [dport N] [keyword <str>]
# 例：
# drop ip 10.1.0.0/24 proto tcp dport 80     # 禁网段访问 80
# drop proto udp sport 53                    # 禁本地 DNS 查询
# drop keyword "game.qq.com"                 # 载荷关键字过滤（只扫首片）

[route]
# 静态路由：<dest/mask> [via <gw>] dev <ifname>
# 直连路由由接口自动推导，不写在这里。
# 10.3.0.0/24 via 10.2.1.2 dev eth1
# 0.0.0.0/0 via 10.1.0.1 dev eth0
